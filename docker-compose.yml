services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nabd
      POSTGRES_PASSWORD: nabd
      POSTGRES_DB: nabd
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabd -d nabd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
