# Production Compose file for نبض البحرين (Nabd Al-Bahrain).
#
# Production bring-up: `docker compose up -d --build` starts both services.
# The only port published is `app` on 127.0.0.1:3000 — the Cloudflare Tunnel
# on the host is what exposes it publicly (see the README's "Production
# deployment" section). The `db` service publishes NOTHING: the app reaches it
# over the compose network, and nothing on the host needs it in production.
#
# Local development: `pnpm dev` runs on the host and needs Postgres on
# 127.0.0.1:5432. Copy docker-compose.override.example.yml to
# docker-compose.override.yml (git-ignored; compose merges it automatically)
# to publish the database to loopback, then `docker compose up -d db`.
# Don't run `app` locally via Docker for day-to-day dev — `pnpm dev` gives
# hot reload, this doesn't.
#
# One-off sync from the app image (no web server, same DB lock as the server):
#   docker compose run --rm app sync -- --dataset <id> --force
#
# Configuration lives in `.env` (copy .env.example). Besides what the app
# reads from it via `env_file`, Compose itself reads these from the same file:
#   POSTGRES_PASSWORD        password for the bundled Postgres (default `nabd`,
#                            which matches databases created by older versions
#                            of this file; for a NEW database set a random hex
#                            value BEFORE the first `up` — the password is baked
#                            into the data volume at first start, and changing
#                            it later needs ALTER USER inside the database).
#                            Use hex (`openssl rand -hex 16`): it goes into a URL.
#   NEXT_PUBLIC_SITE_URL     public origin; baked into the build (canonical
#                            links, sitemap) AND passed at runtime.
#   DB_POOL_SIZE             Prisma connection-pool size for the app (default 12).
#                            Must stay above SYNC_CONCURRENCY + 6: every dataset
#                            being synced holds one connection for its whole
#                            write transaction, and the lock heartbeat, progress
#                            writer, /api/freshness (3 parallel queries) and
#                            page queries need the rest. Prisma's own default is
#                            2*vCPUs+1, i.e. 3 on a 1-vCPU VPS, which a heavy
#                            sync can exhaust (P2024 "Timed out fetching a new
#                            connection", HTTP 500s). A one-off
#                            `docker compose run --rm app sync` opens its own
#                            pool of the same size; Postgres allows 100.
#   APP_MEM_LIMIT            optional memory cap for the app container, e.g.
#                            `1536m`. Unset = no cap. Size it from the Node heap
#                            cap plus 300-400 MB for the Prisma engine, response
#                            buffers and the Next baseline (see APP_NODE_OPTIONS
#                            below). Too small a cap turns a big sync
#                            into an OOM kill that strands the sync lock for the
#                            10-minute stale window, so do not go below ~1.2 GB
#                            while SYNC_CONCURRENCY >= 3.
#   APP_NODE_OPTIONS         optional Node flags for the app container, e.g.
#                            `--max-old-space-size=1024` (V8 old-space cap in MB;
#                            measured peak with three 300k-row datasets in
#                            flight is ~0.6-0.8 GB of heap on top of the Next
#                            baseline, so ~1024 leaves headroom). Set it together
#                            with APP_MEM_LIMIT: a heap cap alone turns memory
#                            pressure into an abrupt "heap out of memory" crash
#                            instead of slower GC.
#   GIT_SHA                  build arg, NOT a runtime variable: the revision the
#                            image was built from, reported as `version` by
#                            /api/health/ready. `.git` is not in the build
#                            context, so pass it on the command line:
#                              GIT_SHA=$(git rev-parse --short HEAD) docker compose up -d --build
#                            Do not keep it in `.env` (a stale value there would
#                            silently report the wrong build).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined at build time, so it must be a build arg.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://data.hekkapp.com}
        # Empty when not provided; the image then reports version: null.
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    # Opt-in memory cap (see APP_MEM_LIMIT above); 0 = unlimited.
    mem_limit: ${APP_MEM_LIMIT:-0}
    # Time for an in-flight sync to abort cleanly and release its lock on stop.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      # The in-compose database, derived from the single POSTGRES_PASSWORD knob
      # (overrides any DATABASE_URL in .env, which is for non-Docker use) with an
      # explicit pool size (see DB_POOL_SIZE above; leave pool_timeout alone:
      # a longer wait only delays the P2024 and piles up health polls).
      - DATABASE_URL=postgresql://nabd:${POSTGRES_PASSWORD:-nabd}@db:5432/nabd?connection_limit=${DB_POOL_SIZE:-12}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://data.hekkapp.com}
      # Tunables the app reads at runtime. Listed bare so they are passed through
      # from .env / the shell when set, and left UNSET (app defaults apply) when
      # not — an explicit empty string would override those defaults.
      # `env_file` above already supplies them from .env; this list documents them.
      - AUTO_SYNC_INTERVAL_MINUTES
      - CACHE_TTL_SECONDS
      - PUBLIC_REFRESH_ENABLED
      - PUBLIC_REFRESH_CATALOG_COOLDOWN_SECONDS
      - PUBLIC_REFRESH_DATASET_COOLDOWN_SECONDS
      - PUBLIC_REFRESH_MAX_RECORDS
      - SYNC_CONCURRENCY
      # Node flags for the server, e.g. --max-old-space-size=1024 (see
      # .env.example). Deliberately a namespaced knob: a bare NODE_OPTIONS would
      # also inherit whatever the HOST shell has set (developers often have a
      # large heap there). Empty = Node's own default.
      - NODE_OPTIONS=${APP_NODE_OPTIONS:-}
      # Where the sync engine POSTs "drop your caches" after a run. Inside the
      # compose network the web service is reachable as `app`; this also makes
      # one-off `docker compose run --rm app sync ...` containers (which have no
      # web server of their own) invalidate the running server's caches.
      - APP_INTERNAL_URL=${APP_INTERNAL_URL:-http://app:3000}
      # 1 when running behind the Cloudflare Tunnel / a reverse proxy: per-client
      # rate limits (login, sync API, public refresh) then key on the real IP.
      # With 0 every visitor shares one bucket.
      - TRUST_PROXY
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # Hardening. The process runs as the unprivileged `nextjs` user (see the
    # Dockerfile) and needs no Linux capabilities: it binds a high port and
    # writes only to .next/cache.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nabd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nabd}
      POSTGRES_DB: nabd
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nabd -d nabd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
