name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same major as docker-compose.yml. The superuser role lets migration 2
    # run `CREATE EXTENSION pg_trgm`, exactly as it does in compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nabd
          POSTGRES_PASSWORD: nabd
          POSTGRES_DB: nabd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nabd -d nabd"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://nabd:nabd@localhost:5432/nabd
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup reads package.json's "packageManager",
      # the same pin the Dockerfile and local development use.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      # Proves every committed migration applies to an empty database.
      - run: pnpm exec prisma migrate deploy

      - run: pnpm typecheck

      - run: pnpm lint

      # Unit tests plus the Postgres-backed integration tests (skipped locally
      # unless RUN_INTEGRATION=1).
      - name: Test
        run: pnpm test
        env:
          RUN_INTEGRATION: "1"

      # Throwaway values: they only need to look like real secrets (>= 32 random
      # chars, distinct), because the build runs with NODE_ENV=production. The
      # build itself reads neither token and needs no database.
      - name: Build
        run: pnpm build
        env:
          ADMIN_TOKEN: 3f9c0a61d84b27e5a1c6f0b9d2e8473a5c1b9e0f6d2a84c7b3e50f1a9d6c2b84
          SYNC_TOKEN: b7e24d9a0c51f836e2a9d4b7c0f1358e6a2d9c4b1f07e83a5d6c9b2e04f7a183

      # Only critical advisories fail the build. High/moderate ones (several sit
      # in transitive build-time dependencies of Next/Prisma) stay visible in the
      # log for a human to triage instead of blocking unrelated changes.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only (nothing is pushed). A fresh checkout has no public/ and no
      # .env, so this catches Dockerfile regressions such as the missing-public
      # COPY that broke the first clean `docker compose up --build`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
